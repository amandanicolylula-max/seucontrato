import type { Config } from "@netlify/functions"

export default async (req: Request) => {
  try {
    const body = await req.json()
    const { pdfBase64 } = body

    if (!pdfBase64) {
      return new Response(JSON.stringify({ error: 'pdfBase64 required' }), {
        status: 400, headers: { "Content-Type": "application/json" }
      })
    }

    const apiKey = Netlify.env.get("ANTHROPIC_API_KEY")
    if (!apiKey) {
      return new Response(JSON.stringify({ error: 'ANTHROPIC_API_KEY not set' }), {
        status: 500, headers: { "Content-Type": "application/json" }
      })
    }

    const anthropicResponse = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4096,
        messages: [{
          role: "user",
          content: [
            {
              type: "document",
              source: {
                type: "base64",
                media_type: "application/pdf",
                data: pdfBase64
              }
            },
            {
              type: "text",
              text: `Você é um especialista em análise jurídica de contratos brasileiros.

Analise o contrato PDF fornecido e extraia TODAS as informações relevantes.

Retorne SOMENTE um objeto JSON válido, sem markdown, sem explicações, sem texto antes ou depois do JSON.

Use exatamente esta estrutura:
{
  "contracting_party": "nome completo da parte contratante",
  "contracting_party_document": "CNPJ ou CPF da parte contratante",
  "contracted_party": "nome completo da parte contratada",
  "contracted_party_document": "CNPJ ou CPF da parte contratada",
  "object_description": "descrição detalhada do objeto do contrato",
  "start_date": "YYYY-MM-DD ou null se não informado",
  "end_date": "YYYY-MM-DD ou null se não informado",
  "total_duration": "duração total em texto (ex: 12 meses) ou null",
  "auto_renewal": true ou false,
  "renewal_notice_days": número de dias ou null,
  "total_value": valor numérico sem formatação ou null,
  "installment_value": valor de cada parcela numérico ou null,
  "installment_count": número de parcelas ou null,
  "readjustment_index": "índice de reajuste (ex: IPCA, IGP-M) ou null",
  "penalty_clause": "descrição da multa contratual ou null",
  "termination_clause": "condições de rescisão ou null",
  "jurisdiction": "cidade/estado do foro eleito ou null",
  "has_confidentiality_clause": true ou false,
  "has_liability_limitation": true ou false,
  "obligations": [
    {
      "party": "nome da parte responsável",
      "description": "descrição clara da obrigação",
      "due_date": "YYYY-MM-DD ou null",
      "is_recurring": true ou false
    }
  ],
  "opportunities": [
    {
      "type": "tipo da oportunidade de serviço",
      "description": "descrição detalhada da vulnerabilidade ou oportunidade de negócio para o escritório",
      "risk_level": "alto, medio ou baixo"
    }
  ]
}

Para "opportunities", identifique especificamente:
- Cláusulas vagas ou ausentes que expõem o cliente a riscos
- Ausência de limitação de responsabilidade
- Reajuste inadequado ou inexistente
- Prazo de rescisão desproporcional
- Ausência de foro definido
- Obrigações sem prazo definido
- Qualquer vulnerabilidade que o escritório Braga & Dantas possa oferecer como serviço adicional`
            }
          ]
        }]
      })
    })

    if (!anthropicResponse.ok) {
      const errorBody = await anthropicResponse.text()
      return new Response(JSON.stringify({
        error: `Anthropic API error: ${anthropicResponse.status}`,
        details: errorBody
      }), { status: 500, headers: { "Content-Type": "application/json" } })
    }

    const result = await anthropicResponse.json()
    const rawText = result.content?.[0]?.text || ""

    let parsed: Record<string, unknown> = {}
    try {
      parsed = JSON.parse(rawText)
    } catch {
      const jsonMatch = rawText.match(/\{[\s\S]*\}/)
      if (jsonMatch) {
        try {
          parsed = JSON.parse(jsonMatch[0])
        } catch {
          return new Response(JSON.stringify({
            error: "Failed to parse Claude response as JSON",
            raw: rawText.substring(0, 500)
          }), { status: 500, headers: { "Content-Type": "application/json" } })
        }
      } else {
        return new Response(JSON.stringify({
          error: "No JSON found in Claude response",
          raw: rawText.substring(0, 500)
        }), { status: 500, headers: { "Content-Type": "application/json" } })
      }
    }

    return new Response(JSON.stringify({ success: true, data: parsed }), {
      headers: { "Content-Type": "application/json" }
    })

  } catch (err) {
    return new Response(JSON.stringify({
      error: "Internal function error",
      details: String(err)
    }), { status: 500, headers: { "Content-Type": "application/json" } })
  }
}

export const config: Config = {
  path: "/api/extract-contract"
}